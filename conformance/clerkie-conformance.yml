method: probed
source: >-
  Live probes of Clerkie/Fiber hosts plus the security and compliance claims made on
  www.clerkie.io/lenders and www.getfiber.ai. No OpenAPI, AsyncAPI, or other machine-readable
  contract exists to derive conformance from, so every entry below is evidenced by a probe or by
  a marketing claim — never by a specification.
note: >-
  Clerkie sells compliance and security posture to regulated lenders ("highest levels of security
  and compliance standards", encryption, role-based access controls, audit logging, real-time
  security monitoring, regulatory monitoring), but publishes no certification, no trust center, no
  security.txt, and no machine-readable contract that any of these claims could be checked against.
  Every claim below is asserted on a marketing page and unverifiable from the public surface.
