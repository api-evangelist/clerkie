aid: clerkie
name: Clerkie
description: >-
  Clerkie, operated by Henry Labs Inc. and founded in San Francisco in 2016, is an AI-powered debt
  management and loan-recovery platform serving both consumers and institutional lenders. The consumer
  side offers a conversational financial assistant for budgeting, debt negotiation, and personalized
  repayment planning, while the B2B side — marketed as Fiber, launched in 2021 and now sold on its own
  domain getfiber.ai — gives lenders, banks, credit unions, and collection agencies an AI-driven recovery
  suite spanning CRM, an inventory management system (IMS), an AI agent, omnichannel communications,
  borrower scoring, a self-service payment portal, and workflow automation. Clerkie markets a RESTful API
  and multi-currency payment processing for lenders to integrate loan portfolios, real-time reporting, and
  automated repayment arrangements, but publishes no public developer documentation, machine-readable API
  contract, or self-serve developer portal — integration is arranged through a sales conversation. The
  company has raised over $41M from Left Lane Capital, Flourish Ventures, Vestigo Ventures, and Citibank.
